<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Frontline Unit Cards · Önizleme</title>
<link rel="stylesheet" href="/styles/unit-cards.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#7c8a63;color:#eee8d6;font:14px Arial,sans-serif}body::before{content:"";position:fixed;inset:0;background:linear-gradient(30deg,#384d3138 12%,transparent 12.5%,transparent 87%,#384d3138 87.5%),linear-gradient(150deg,#384d3138 12%,transparent 12.5%,transparent 87%,#384d3138 87.5%),linear-gradient(30deg,#384d3138 12%,transparent 12.5%,transparent 87%,#384d3138 87.5%),linear-gradient(150deg,#384d3138 12%,transparent 12.5%,transparent 87%,#384d3138 87.5%),linear-gradient(60deg,#6c795455 25%,transparent 25.5%,transparent 75%,#6c795455 75%);background-size:104px 180px;background-position:0 0,0 0,52px 90px,52px 90px,0 0;z-index:-1}.toolbar{position:absolute;top:0;left:0;right:0;padding:22px 28px;background:linear-gradient(#111b16ee,#111b16bb);border-bottom:1px solid #d0b87a55;display:flex;align-items:center;gap:14px;flex-wrap:wrap}.toolbar h1{font:22px Georgia,serif;letter-spacing:1px;margin:0 auto 0 0}.toolbar small{display:block;color:#b6baa6;font:10px Arial;letter-spacing:2px;margin-top:6px;text-transform:uppercase}button{background:#1d2a22;color:#e8dfc2;border:1px solid #a9945c88;border-radius:3px;padding:8px 11px;cursor:pointer}button:hover{border-color:#e2ca85}#unit{position:absolute;left:180px;top:285px;width:66px;height:66px;padding:8px;border:2px solid #d4c191;border-radius:50%;background:#263b2ad9;box-shadow:0 3px 10px #17291866}#unit img{width:100%;height:100%}.map-label{position:absolute;bottom:35px;left:28px;color:#213825;letter-spacing:3px;text-transform:uppercase;font:13px Georgia}#test-output{position:absolute;left:28px;bottom:70px;max-width:600px;background:#111b16e8;padding:14px;white-space:pre-wrap;font-size:12px;max-height:150px;overflow:auto}#test-output:empty{display:none}.fuc-editor{position:absolute;right:28px;top:90px;width:min(610px,calc(100vw - 56px));height:calc(100vh - 125px);z-index:100;background:#1e2822;color:#ece4ce;border:1px solid #a99565;border-radius:5px;box-shadow:0 15px 40px #0009}.fuc-editor input,.fuc-editor textarea,.fuc-editor select{padding:7px;background:#111b16;color:#eee5cd;border:1px solid #7a80654a;border-radius:3px}.fuc-editor input[type=checkbox]{width:auto}.window-content{height:100%}.fuc-card{z-index:110}
</style>
<header class="toolbar"><h1>FRONTLINE <small>Birlik kartı · Foundry VTT 13</small></h1><button id="open-card">Kartı aç</button><button id="wound-add">Yara +1</button><button id="wound-remove">Yara −1</button><button id="move-edge">Sağ kenara taşı</button><button id="edit-card">Kartı düzenle</button><button id="run-tests">Testleri çalıştır</button></header>
<button id="unit" aria-label="Demir Muhafız tokenı"><img src="/tests/tank.svg" alt=""></button><span class="map-label">Astar / Doğu cephesi / 04</span><output id="test-output" aria-live="polite"></output>
<script src="/handlebars.js"></script><script type="module" src="/tests/browser-harness.mjs"></script></html>
